<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Break Reminder - Cross Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            min-width: 100px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-start {
            background-color: #4caf50;
        }

        .btn-stop {
            background-color: #f44336;
        }

        .btn-pause {
            background-color: #ff9800;
        }

        .btn-resume {
            background-color: #2196f3;
        }

        .status {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 8px;
            font-weight: 500;
        }

        .status.running {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .status.paused {
            background-color: #fff3e0;
            color: #e65100;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
            width: 400px;
        }

        .modal-content h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .modal-content p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .countdown {
            font-size: 36px;
            font-weight: bold;
            color: #2196f3;
            margin: 20px 0;
        }

        /* Responsive design */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            button {
                min-width: 80px;
                padding: 10px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🕐 Break Reminder</h1>
        
        <div class="input-group">
            <label for="interval">Reminder Interval (minutes):</label>
            <input type="number" id="interval" value="{{ interval }}" min="1" max="120">
        </div>

        <div class="button-group">
            <button id="startBtn" class="btn-start" onclick="startTimer()">Start</button>
            <button id="stopBtn" class="btn-stop" onclick="stopTimer()" disabled>Stop</button>
            <button id="pauseBtn" class="btn-pause" onclick="pauseTimer()" disabled>Pause</button>
            <button id="resumeBtn" class="btn-resume" onclick="resumeTimer()" disabled>Resume</button>
        </div>

        <div id="status" class="status">Timer is stopped</div>
    </div>

    <div id="reminderModal" class="modal">
        <div class="modal-content">
            <h2>⏰ Time for a Break!</h2>
            <p>Look at something 20 feet away<br>for 20 seconds!</p>
            <div id="countdown" class="countdown">20</div>
            <p>seconds remaining</p>
        </div>
    </div>

    <script>
        let timerInterval = null;
        let countdownInterval = null;
        let reminderTimeout = null;
        let isRunning = false;
        let isPaused = false;
        let nextBreakTime = null;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const status = document.getElementById('status');
        const intervalInput = document.getElementById('interval');
        const modal = document.getElementById('reminderModal');
        const countdownElement = document.getElementById('countdown');

        // Audio context for cross-platform sound
        let audioContext = null;

        function playBeep() {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 1000;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            } catch (e) {
                console.log('Audio not supported:', e);
            }
        }

        function startTimer() {
            const interval = parseInt(intervalInput.value) * 60 * 1000; // Convert to milliseconds
            
            isRunning = true;
            isPaused = false;
            nextBreakTime = Date.now() + interval;
            
            startBtn.disabled = true;
            stopBtn.disabled = false;
            pauseBtn.disabled = false;
            resumeBtn.disabled = true;
            
            updateStatus();
            saveSettings();
            
            reminderTimeout = setTimeout(showReminder, interval);
            timerInterval = setInterval(updateStatus, 1000);
        }

        function stopTimer() {
            isRunning = false;
            isPaused = false;
            
            if (reminderTimeout) clearTimeout(reminderTimeout);
            if (timerInterval) clearInterval(timerInterval);
            
            startBtn.disabled = false;
            stopBtn.disabled = true;
            pauseBtn.disabled = true;
            resumeBtn.disabled = true;
            
            status.textContent = 'Timer is stopped';
            status.className = 'status';
            
            saveSettings();
        }

        function pauseTimer() {
            isPaused = true;
            
            if (reminderTimeout) clearTimeout(reminderTimeout);
            if (timerInterval) clearInterval(timerInterval);
            
            pauseBtn.disabled = true;
            resumeBtn.disabled = false;
            
            status.textContent = 'Timer is paused';
            status.className = 'status paused';
        }

        function resumeTimer() {
            const interval = parseInt(intervalInput.value) * 60 * 1000;
            
            isPaused = false;
            nextBreakTime = Date.now() + interval;
            
            pauseBtn.disabled = false;
            resumeBtn.disabled = true;
            
            updateStatus();
            
            reminderTimeout = setTimeout(showReminder, interval);
            timerInterval = setInterval(updateStatus, 1000);
        }

        function updateStatus() {
            if (!isRunning || isPaused) return;
            
            const remaining = Math.max(0, nextBreakTime - Date.now());
            const minutes = Math.floor(remaining / 60000);
            const seconds = Math.floor((remaining % 60000) / 1000);
            
            status.textContent = `Next break in: ${minutes}m ${seconds}s`;
            status.className = 'status running';
        }

        function showReminder() {
            modal.classList.add('active');
            playBeep();
            
            let count = 20;
            countdownElement.textContent = count;
            
            countdownInterval = setInterval(() => {
                count--;
                countdownElement.textContent = count;
                
                if (count <= 0) {
                    clearInterval(countdownInterval);
                    modal.classList.remove('active');
                    
                    if (isRunning && !isPaused) {
                        const interval = parseInt(intervalInput.value) * 60 * 1000;
                        nextBreakTime = Date.now() + interval;
                        reminderTimeout = setTimeout(showReminder, interval);
                    }
                }
            }, 1000);
        }

        function saveSettings() {
            const settings = {
                interval: intervalInput.value
            };
            
            fetch('/api/settings', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(settings)
            });
        }

        // Save settings when interval changes
        intervalInput.addEventListener('change', saveSettings);

        // Close modal if clicked outside
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                if (countdownInterval) clearInterval(countdownInterval);
                modal.classList.remove('active');
                
                if (isRunning && !isPaused) {
                    const interval = parseInt(intervalInput.value) * 60 * 1000;
                    nextBreakTime = Date.now() + interval;
                    reminderTimeout = setTimeout(showReminder, interval);
                }
            }
        });
    </script>
</body>
</html>
